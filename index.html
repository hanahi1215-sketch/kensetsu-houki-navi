<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2463c5">
<title>建築法規ナビ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#14243d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Meiryo,sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;padding-bottom:42px}header{display:flex;gap:12px;align-items:center;padding:22px 16px 14px}.logo{width:52px;height:52px;border-radius:15px;background:#eaf2ff;display:grid;place-items:center;font-size:26px}header b{display:block;font-size:21px}header small{font-size:11px;color:#728094}.hero{margin:0 14px;padding:22px 18px;border-radius:20px;background:linear-gradient(145deg,#2463c5,#123f80);color:#fff}.hero div{font-size:11px;font-weight:800;opacity:.85}.hero h1{font-size:25px;line-height:1.42;margin:7px 0 0}section{padding:20px 14px 0}h2{font-size:18px;margin:0 0 11px}.row,.checkrow{min-height:50px;border:1px solid #e0e7ef;border-radius:12px;margin:8px 0;padding:8px 11px;display:flex;align-items:center;justify-content:space-between;background:#fff}.row>span,.checkrow>span{font-size:12px;font-weight:800}.row select{max-width:67%;border:0;background:transparent;color:#2463c5;font-weight:700;outline:0;text-align:right}.num{display:flex;align-items:center;gap:6px}.num input{width:128px;border:1px solid #d5deea;border-radius:8px;padding:8px;font-size:15px;text-align:right}.num b{font-size:11px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:7px}.twocol .row{display:block}.twocol .row>span{display:block;margin-bottom:7px}.twocol .num input{width:82px}.checkrow input{width:21px;height:21px}.specific{background:#f7f9ff;border:1px solid #dce6fa;border-radius:15px;padding:12px;margin:12px 0}.specific h3{font-size:13px;color:#24579b;margin:0 0 8px}.summary{margin:20px 14px 0;padding:14px 15px;border-radius:14px;background:#eef5ff;border:1px solid #d8e6fa;display:flex;justify-content:space-between;align-items:center}.summary b{font-size:14px}.summary div small{display:block;font-size:10px;color:#69788c;margin-top:3px}.summary strong{font-size:24px;color:#2463c5;text-align:center}.summary strong small{display:block;font-size:9px}.g{display:flex;justify-content:space-between;border-bottom:2px solid #e7ebf1;padding-bottom:7px}.g small{font-size:10px;background:#eef2f6;border-radius:8px;padding:3px 7px}.g.target{color:#c43d29}.g.cond{color:#a56c00}.g.check{color:#2463c5}.g.off{color:#778394}.card{border:1px solid #dfe6ef;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 4px 15px #1836500a}.cat{display:inline-block;background:#eaf2ff;color:#2463c5;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:800}.card h3{font-size:16px;margin:9px 0 6px}.easy{font-size:13px;line-height:1.7;margin:0 0 10px}.reason,.need{border-radius:11px;padding:10px 11px;margin:8px 0}.reason{background:#f3f8ff}.need{background:#fff8eb}.reason b,.need b{font-size:10px}.reason p,.need p{font-size:11px;line-height:1.65;margin:4px 0 0;color:#57677a}.notice{margin:18px 14px;padding:13px;border-radius:12px;background:#fff7e9;border:1px solid #eeddbb;color:#755c31;font-size:10px;line-height:1.7}
</style>
</head>
<body>
<main class="app">
<header><div class="logo">🏙️</div><div><b>建築法規ナビ</b><small>用途・規模から逆引き</small></div></header>
<section class="hero"><div>確認申請の見落とし防止</div><h1>必要な規制を<br>用途別に自動チェック</h1></section>
<section>
<h2>建物条件</h2>
<div class="row"><span>建築地</span><select id="location"><option>加古川市</option><option>高砂市</option><option>播磨町</option><option>稲美町</option><option>明石市</option><option>神戸市</option></select></div>
<div class="row"><span>用途</span><select id="useType"><option>一戸建て住宅</option><option>長屋</option><option selected>共同住宅</option><option>寄宿舎</option><option>飲食店</option><option>店舗・物販店</option><option>事務所</option><option>ホテル・旅館</option><option>病院・診療所</option><option>学校</option><option>工場・倉庫</option></select></div>
<div class="twocol">
<label class="row"><span>地上階数</span><div class="num"><input id="floors" type="number" min="1" value="3"><b>階</b></div></label>
<label class="row"><span>地下階数</span><div class="num"><input id="basement" type="number" min="0" value="0"><b>階</b></div></label>
</div>
<label class="row"><span>延べ面積</span><div class="num"><input id="area" type="number" min="0" value="500"><b>㎡</b></div></label>
<label class="row"><span>建築面積</span><div class="num"><input id="buildingArea" type="number" min="0"><b>㎡</b></div></label>
<div id="specific"></div>
<label class="row"><span>建物高さ</span><div class="num"><input id="height" type="number" min="0" step="0.01"><b>m</b></div></label>
</section>
<section class="summary"><div><b id="sumTitle"></b><small id="sumSub"></small></div><strong><span id="sumCount">0</span><small>確認項目</small></strong></section>
<div id="results"></div>
<section class="notice">この逆引きは確認漏れを減らすための支援用です。最終判断は現行法令・告示・兵庫県および各市町の取扱いで確認してください。</section>
</main>
<script>
const $=id=>document.getElementById(id);
function vals(){return {location:$("location").value,useType:$("useType").value,floors:+$("floors").value||1,basement:+$("basement").value||0,area:+$("area").value||0,buildingArea:+$("buildingArea").value||0,height:+$("height").value||0,unitArea:+($("unitArea")?.value||0),roomArea:+($("roomArea")?.value||0),bedroomArea:+($("bedroomArea")?.value||0),mainStructure:$("mainStructure")?.value||"準耐火・不燃以外"}}
function add(r,status,cat,name,summary,reason,need){r.push({status,cat,name,summary,reason,need})}
function rules(x){const r=[],a=x.area,f=x.floors,room=x.roomArea,unit=x.unitArea,bed=x.bedroomArea,b=x.buildingArea,non=x.mainStructure==="準耐火・不燃以外";
if(f>=2)add(r,"対象","避難","直通階段","避難階以外の階から直接避難階へつながる階段を確認します。",`${f}階建てです。`,"歩行距離・居室用途・主要構造部");
if(f>=3)add(r,"対象","消防","非常用進入口・代替進入口","消防隊が外から入りやすい開口を確認します。",`${f}階建てです。`,"対象階高さ・外壁面・除外条件");
if(x.height>20)add(r,"対象","設備","避雷設備","雷から建物を守る設備です。",`高さ${x.height}mです。`,"周囲状況による例外");
if(x.height>31)add(r,"対象","設備","非常用エレベーター","消防活動などに使う非常用エレベーターです。",`高さ${x.height}mです。`,"除外条件");
if(x.useType==="共同住宅"){
add(r,"対象","防火","界壁","住戸どうしを火や音が伝わりにくい壁で区切ります。","共同住宅です。","界壁構造・小屋裏/天井裏");
if(f>=3)add(r,"対象","防火","耐火性能の確認","3階共同住宅として耐火性能を確認します。","3階建てです。","用途部分面積・主要構造部");
if(unit>100||room>100)add(r,"対象","避難","廊下幅","共用廊下の必要幅を確認します。",`住戸${unit||"未入力"}㎡、居室${room||"未入力"}㎡。`,"両側居室か片側居室か");
else add(r,"原則対象外","避難","廊下幅","入力条件では優先度が低い項目です。",`住戸${unit||"未入力"}㎡、居室${room||"未入力"}㎡。`,"階別居室面積");
if(f>=3&&(room>200||(non&&room>100)))add(r,"対象","避難","2以上の直通階段","2方向避難を確認します。",`居室${room}㎡、主要構造部=${x.mainStructure}。`,"各階居室面積・主要構造部");
else add(r,"条件確認","避難","2以上の直通階段","階・居室面積・主要構造部で必要性が変わります。",`居室${room||"未入力"}㎡。`,"2階/3階の居室面積・主要構造部");
if(a>500)add(r,"対象","設備","排煙設備","延べ500㎡超として排煙設備を確認します。",`延べ${a}㎡です。`,"区画・除外・開口条件");
else add(r,"原則対象外","設備","排煙設備","延べ面積だけでは500㎡以下です。",`延べ${a||"未入力"}㎡です。`,"無窓居室等があれば再判定");
add(r,"対象","設備","非常用照明","非常用照明の適用範囲と除外を確認します。","共同住宅です。","住戸内除外・共用部");
if(f>=3)add(r,"対象","防火","竪穴区画","縦につながる部分の防火区画を確認します。","3階建てです。","階段・吹抜け等");
if(a>500)add(r,"条件確認","防火","面積区画","規模・耐火性能に応じた面積区画を確認します。",`延べ${a}㎡です。`,"各階床面積・主要構造部");
if(b>300)add(r,"条件確認","防火","隔壁","建築面積300㎡超の場合の隔壁関係を確認します。",`建築面積${b}㎡です。`,"小屋組・区画方法");
}
if(x.useType==="長屋"){
add(r,"対象","防火","隔壁","住戸どうしを火や音が伝わりにくい壁で区切ります。","長屋です。","隔壁位置・構造");
if(f>=3)add(r,"対象","防火","竪穴区画","縦につながる部分を区画します。","3階建て以上です。","階段・吹抜け");
if(a>500)add(r,"対象","設備","排煙設備","延べ500㎡超として排煙設備を確認します。",`延べ${a}㎡です。`,"区画・除外条件");
if(f>=3&&(room>200||(non&&room>100)))add(r,"対象","避難","2以上の直通階段","2方向避難を確認します。",`居室${room}㎡です。`,"階別居室面積・主要構造部");
else add(r,"条件確認","避難","2以上の直通階段","居室面積と主要構造部で必要性が変わります。",`居室${room||"未入力"}㎡です。`,"階別居室面積・主要構造部");
}
if(x.useType==="寄宿舎"){
if(f>=3)add(r,"対象","防火","耐火性能の確認","3階寄宿舎として耐火性能を確認します。","3階建てです。","用途部分面積・主要構造部");
if(room>200)add(r,"対象","避難","廊下幅","居室床面積が大きいため廊下幅を確認します。",`居室${room}㎡です。`,"両側居室/片側居室");
else add(r,"原則対象外","避難","廊下幅","入力条件では優先度が低い項目です。",`居室${room||"未入力"}㎡です。`,"階別居室面積");
if(room>200||(non&&bed>100))add(r,"対象","避難","2以上の直通階段","2方向避難を確認します。",`居室${room||0}㎡、寝室${bed||0}㎡。`,"各階居室・寝室面積");
else add(r,"条件確認","避難","2以上の直通階段","居室200㎡・寝室100㎡等が重要な目安です。",`居室${room||"未入力"}㎡、寝室${bed||"未入力"}㎡。`,"各階居室・寝室面積、主要構造部");
if(a>500)add(r,"対象","設備","排煙設備","延べ500㎡超として排煙設備を確認します。",`延べ${a}㎡です。`,"区画・開口・除外条件");
add(r,"対象","設備","非常用照明","非常用照明の適用範囲を確認します。","寄宿舎です。","居室・共用部・除外");
add(r,"対象","防火","防火上主要な間仕切壁","寝室などの間仕切壁を確認します。","寄宿舎です。","間仕切壁位置・構造");
if(f>=3)add(r,"対象","防火","竪穴区画","竪穴区画を確認します。","3階建てです。","階段・吹抜け等");
}
return r}
function renderSpecific(){const u=$("useType").value;if(!["長屋","共同住宅","寄宿舎"].includes(u)){$("specific").innerHTML="";return}let h=`<div class="specific"><h3>${u}専用入力</h3>`;if(u==="共同住宅")h+=`<label class="row"><span>1住戸の最大床面積</span><div class="num"><input id="unitArea" type="number" min="0"><b>㎡</b></div></label>`;h+=`<label class="row"><span>各階の居室床面積（最大）</span><div class="num"><input id="roomArea" type="number" min="0"><b>㎡</b></div></label>`;if(u==="寄宿舎")h+=`<label class="row"><span>寝室床面積（最大）</span><div class="num"><input id="bedroomArea" type="number" min="0"><b>㎡</b></div></label>`;h+=`<div class="row"><span>主要構造部</span><select id="mainStructure"><option>準耐火・不燃以外</option><option>準耐火構造等</option><option>耐火構造等</option></select></div></div>`;$("specific").innerHTML=h;$("specific").querySelectorAll("input,select").forEach(e=>e.addEventListener("input",render))}
function render(){const x=vals(),r=rules(x),groups=[["対象","target"],["条件確認","cond"],["確認","check"],["原則対象外","off"]];$("sumTitle").textContent=`${x.location} / ${x.useType}`;$("sumSub").textContent=`${x.floors}階・延べ${x.area||"未入力"}㎡`;$("sumCount").textContent=r.filter(v=>v.status!=="原則対象外").length;$("results").innerHTML=groups.map(([g,c])=>{const a=r.filter(v=>v.status===g);if(!a.length)return"";return `<section><h2 class="g ${c}">${g}<small>${a.length}</small></h2>${a.map(v=>`<article class="card"><span class="cat">${v.cat}</span><h3>${v.name}</h3><p class="easy">${v.summary}</p><div class="reason"><b>この計画での判定</b><p>${v.reason}</p></div><div class="need"><b>最終確認に必要</b><p>${v.need}</p></div></article>`).join("")}</section>`}).join("")}
document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",()=>{if(e.id==="useType")renderSpecific();render()}));
renderSpecific();render();
</script>
</body>
</html>
